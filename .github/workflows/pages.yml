name: Deploy INFINITY WORLD preview
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate exact-avatar preview payload
        run: |
          set -euo pipefail
          test -f index.html
          test -f avatar-build.json
          test -f models/avatar-v3/model-chunks.json
          test -f models/avatar-v3/chunks/part-000.txt
          node -e "const f=require('fs');const b=JSON.parse(f.readFileSync('avatar-build.json','utf8'));if(b.sourceRevision!=='exact-v2-hq'||b.identityLocked!==true)process.exit(1);const m=JSON.parse(f.readFileSync('models/avatar-v3/model-chunks.json','utf8'));if(!Array.isArray(m.parts)||m.parts.length<1)process.exit(1);console.log('exact avatar preview',b.sourceRevision,m.parts.length)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
